❤️<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NISHAL GAMING</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;

    background:
    radial-gradient(circle at 20% 20%,#3700ff55,transparent 35%),
    radial-gradient(circle at 80% 80%,#ff003355,transparent 35%),
    #030305;
}

body::before{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    background:#6500ff;
    filter:blur(150px);
    opacity:.18;
    animation:move 7s infinite alternate;
}

@keyframes move{
    from{
        transform:translate(-100px,-80px);
    }
    to{
        transform:translate(100px,80px);
    }
}

.container{
    width:90%;
    max-width:600px;
    position:relative;
    z-index:2;
}

.logo{
    font-size:clamp(42px,10vw,75px);
    font-weight:900;
    letter-spacing:4px;

    text-shadow:
    0 0 8px #ff1744,
    0 0 20px #ff1744,
    0 0 45px #7200ff;
}

.subtitle{
    margin-top:10px;
    color:#aaa;
    letter-spacing:4px;
    font-size:13px;
}

.card{
    margin-top:35px;
    padding:35px 25px;
    border-radius:24px;

    background:rgba(10,10,16,.82);
    border:1px solid #ffffff18;

    box-shadow:
    0 0 40px #6500ff25,
    inset 0 0 30px #ffffff05;

    backdrop-filter:blur(15px);
}

.card h2{
    font-size:27px;
    margin-bottom:12px;
}

.card p{
    color:#999;
    line-height:1.6;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

button{
    min-width:130px;
    padding:14px 25px;
    border:0;
    border-radius:11px;
    color:white;
    font-weight:bold;
    cursor:pointer;

    background:linear-gradient(
        135deg,
        #7200ff,
        #ff1744
    );

    box-shadow:0 0 20px #7200ff40;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

.register{
    background:#17171d;
    border:1px solid #ffffff22;
    box-shadow:none;
}

footer{
    margin-top:25px;
    color:#555;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        NISHAL GAMING
    </div>

    <div class="subtitle">
        GAMING • EDITING • DIGITAL WORLD
    </div>

    <div class="card">

        <h2>WELCOME GAMER 🔥</h2>

        <p>
            Enter the official NISHAL GAMING world.
            Your gaming and digital experience starts here.
        </p>

        <div class="buttons">

            <button onclick="login()">
                LOGIN
            </button>

            <button class="register" onclick="register()">
                REGISTER
            </button>

        </div>

    </div>

    <footer>
        © 2026 NISHAL GAMING
    </footer>

</div>

<script>

function login(){
    alert("LOGIN PAGE COMING NEXT 🔥");
}

function register(){
    alert("REGISTER PAGE COMING NEXT 🔥");
}

</script>

</body>
            </html>
