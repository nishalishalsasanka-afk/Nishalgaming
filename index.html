<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NISHAL GAMING</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --red:#ff1744;
    --purple:#7c00ff;
    --blue:#00aaff;
    --dark:#050509;
    --card:rgba(12,12,20,.88);
}

body{
    min-height:100vh;
    color:#fff;
    background:#030305;
    overflow-x:hidden;
}

body:before,
body:after{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.25;
    z-index:-2;
    animation:float 8s infinite alternate ease-in-out;
}

body:before{
    background:#7200ff;
    top:-100px;
    left:-100px;
}

body:after{
    background:#ff003c;
    right:-100px;
    bottom:-100px;
    animation-delay:2s;
}

@keyframes float{
    from{transform:translate(0,0)}
    to{transform:translate(80px,50px)}
}

.screen{
    display:none;
    min-height:100vh;
}

.screen.active{
    display:flex;
}

/* LOGIN */

#auth{
    align-items:center;
    justify-content:center;
    padding:20px;
    background:

    radial-gradient(circle at center,#24006b,transparent 55%);
}

.auth-box{
    width:100%;
    max-width:430px;
    padding:30px 25px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:24px;
    background:var(--card);
    box-shadow:0 0 50px rgba(124,0,255,.3);
    backdrop-filter:blur(15px);
}

.logo{
    text-align:center;
    font-size:42px;
    font-weight:1000;

    text-shadow:

.tagline{

.tabs{

}

.form{

}

}

h2{

    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;

    border-radius:10px;
    border:1px solid #333;
    background:#07070b;
    color:#fff;
    outline:none;
}

input:focus{
    border-color:var(--purple);
    box-shadow:0 0 12px rgba(124,0,255,.35);
}

.btn{

    border:0;
    border-radius:11px;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    background:linear-gradient(135deg,var(--purple),var(--red));
    cursor:pointer;
}
