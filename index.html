<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NISHAL GAMING</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#030305;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

/* ===== ANIMATED BACKGROUND ===== */

body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    background:#6f00ff;
    border-radius:50%;
    filter:blur(150px);
    opacity:.18;
    top:-160px;
    left:-160px;
    animation:glow 7s infinite alternate;
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    background:#ff003c;
    border-radius:50%;
    filter:blur(150px);
    opacity:.15;
    right:-160px;
    bottom:-160px;
    animation:glow2 8s infinite alternate;
    z-index:-2;
}

@keyframes glow{
    from{transform:translate(0,0)}
    to{transform:translate(150px,100px)}
}

@keyframes glow2{
    from{transform:translate(0,0)}
    to{transform:translate(-130px,-100px)}
}

/* ===== SNOW ===== */

.snow{
    position:fixed;
    top:-20px;
    color:white;
    font-size:18px;
    pointer-events:none;
    z-index:20;
    animation:fall linear infinite;
}

@keyframes fall{
    0%{
        transform:translateY(-30px) rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:.2;
    }
}

/* ===== AUTH ===== */

#auth{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:420px;
    padding:30px 24px;
    background:rgba(10,10,16,.9);
    border:1px solid #ffffff18;
    border-radius:24px;
    box-shadow:0 0 50px #7200ff35;
    backdrop-filter:blur(15px);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    letter-spacing:3px;
    text-shadow:
    0 0 10px red,
    0 0 25px #7200ff,
    0 0 45px red;
}

.sub{
    text-align:center;
    color:#888;
    font-size:12px;
    letter-spacing:3px;
    margin:8px 0 25px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#18181f;
    color:#999;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    color:#fff;
    background:linear-gradient(135deg,#7200ff,#ff1744);
}

.form{
    display:none;
}

.form.active{
    display:block;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:13px;
    border:1px solid #333;
    border-radius:10px;
    background:#07070a;
    color:#fff;
    outline:none;
}

input:focus{
    border-color:#7200ff;
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-weight:bold;
    font-size:15px;
    background:linear-gradient(135deg,#7200ff,#ff1744);
    cursor:pointer;
}

.message{
    text-align:center;
    color:#aaa;
    font-size:13px;
    margin-top:13px;
}

/* ===== DASHBOARD ===== */

#dashboard{
    display:none;
    min-height:100vh;
}

#dashboard.active{
    display:block;
}

.navbar{
    position:sticky;
    top:0;
    z-index:10;
    padding:17px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(5,5,9,.85);
    border-bottom:1px solid #ffffff12;
    backdrop-filter:blur(15px);
}

.nav-logo{
    font-size:21px;
    font-weight:900;
    text-shadow:0 0 15px red;
}

.logout{
    padding:9px 17px;
    border:1px solid #444;
    border-radius:9px;
    background:#111;
    color:#fff;
    cursor:pointer;
}

.content{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

/* ===== HERO ===== */

.hero{
    position:relative;
    overflow:hidden;
    padding:35px;
    border-radius:25px;
    background:
    linear-gradient(120deg,#6500ff30,#ff003c15),
    rgba(12,12,20,.9);
    border:1px solid #ffffff14;
    box-shadow:0 0 40px #6500ff25;
}

.hero-text{
    position:relative;
    z-index:2;
}

.hero small{
    color:#a888ff;
    letter-spacing:2px;
}

.hero h1{
    font-size:clamp(32px,6vw,60px);
    margin:10px 0;
}

.hero p{
    color:#aaa;
    max-width:650px;
    line-height:1.7;
}

.premium{
    display:inline-block;
    margin-top:20px;
    padding:11px 20px;
    border-radius:30px;
    background:linear-gradient(135deg,#ffd700,#ff7b00);
    color:#111;
    font-weight:900;
}

/* ===== DANCING GAMER ===== */

.gamer{
    position:absolute;
    right:7%;
    bottom:10px;
    font-size:90px;
    animation:dance .8s infinite alternate ease-in-out;
}

@keyframes dance{
    0%{
        transform:rotate(-8deg) translateY(0);
    }

    50%{
        transform:rotate(8deg) translateY(-12px);
    }

    100%{
        transform:rotate(-5deg) translateY(0);
    }
}

/* ===== STATS ===== */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:22px;
}

.stat{
    padding:22px;
    border-radius:18px;
    background:rgba(12,12,18,.88);
    border:1px solid #ffffff12;
}

.stat-icon{
    font-size:28px;
}

.stat h3{
    margin:8px 0 5px;
}

.stat p{
    color:#888;
    font-size:13px;
}

/* ===== MENU ===== */

.title{
    margin:28px 0 15px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.menu-card{
    padding:25px;
    border-radius:18px;
    background:linear-gradient(145deg,#11111a,#08080d);
    border:1px solid #ffffff12;
    transition:.25s;
    cursor:pointer;
}

.menu-card:hover{
    transform:translateY(-6px);
    border-color:#7200ff;
    box-shadow:0 0 25px #7200ff30;
}

.menu-card span{
    font-size:32px;
}

.menu-card h3{
    margin:12px 0 7px;
}

.menu-card p{
    color:#888;
    font-size:13px;
}

/* ===== WHATSAPP ===== */

.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:#19c
