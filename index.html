<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shadow Editz</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.85)),
        radial-gradient(circle at top right, #3b0066, transparent 40%),
        radial-gradient(circle at bottom left, #001f4d, transparent 40%),
        #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow:
        0 0 10px #ff0000,
        0 0 25px #8a00ff;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #ccc;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .card {
      background: rgba(15,15,20,.88);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 20px;
      padding: 35px 20px;
      box-shadow: 0 0 35px rgba(120,0,255,.25);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .text {
      color: #bbb;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #7b00ff, #ff0055);
      box-shadow: 0 0 18px rgba(170,0,255,.4);
    }

    button:hover {
      transform: scale(1.04);
    }

    .whatsapp {
      background: #128c7e;
      box-shadow: 0 0 18px rgba(18,140,126,.4);
    }

    footer {
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .logo {
        font-size: 30px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head
